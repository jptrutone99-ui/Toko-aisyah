name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract and Move Project Files
        run: |
          # Ekstrak arsip zip atau tar
          if [ -f *.zip ]; then
            unzip -o *.zip -d .
          elif [ -f *.tar* ]; then
            tar -xvf *.tar*
          fi

          # Temukan lokasi pubspec.yaml dan pindahkan isinya ke root
          PUB_FILE=$(find . -mindepth 2 -name "pubspec.yaml" | head -n 1)
          if [ -n "$PUB_FILE" ]; then
            DIR=$(dirname "$PUB_FILE")
            echo "Memindahkan file dari $DIR ke folder utama..."
            cp -r $DIR/* .
          fi
          
          ls -la

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
