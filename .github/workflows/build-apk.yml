name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract and Move Everything
        run: |
          # Ekstrak semua zip/tar yang ada
          unzip -o TokoAisyah.zip -d . || true
          tar -xvf TokoAisyah_progress.tar.gz.tar || true

          # Pindahkan semua file dari folder TokoAisyah atau TokoAisyah_progress ke root
          if [ -d TokoAisyah ]; then
            cp -r TokoAisyah/* . || true
          fi
          if [ -d TokoAisyah_progress ]; then
            cp -r TokoAisyah_progress/* . || true
          fi

          echo "=== ISI FOLDER UTAMA ==="
          ls -la

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
