name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Any Archive
        run: |
          if [ -f *.zip ]; then
            unzip -o *.zip -d .
          elif [ -f *.tar* ]; then
            tar -xvf *.tar*
          fi
          
          # Cari lokasi pubspec.yaml dan pindahkan semua isinya ke root
          PROJECT_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          if [ -n "$PROJECT_DIR" ] && [ "$PROJECT_DIR" != "." ]; then
            echo "Memindahkan file dari $PROJECT_DIR ke root..."
            cp -rn $PROJECT_DIR/* . || true
          fi
          ls -la

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
